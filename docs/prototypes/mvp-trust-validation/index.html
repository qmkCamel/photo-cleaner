<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrueKeep MVP Trust Validation Prototype</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f5f7f4;
        --paper: #ffffff;
        --ink: #151917;
        --muted: #69736f;
        --quiet: #8a958f;
        --line: #dfe5e0;
        --line-strong: #c8d2cc;
        --green: #2f7566;
        --green-strong: #246457;
        --green-soft: #e6f1ec;
        --yellow: #f4c96b;
        --yellow-soft: #fff6df;
        --blue-soft: #eaf4fb;
        --rose: #c96372;
        --rose-soft: #fff0f1;
        --shadow: 0 26px 80px rgba(23, 34, 29, 0.12);
        --phone-w: 390px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 18% 12%, rgba(244, 201, 107, 0.22), transparent 30%),
          linear-gradient(145deg, #f8faf7 0%, var(--page) 44%, #eef4f0 100%);
        color: var(--ink);
        letter-spacing: 0;
      }

      button {
        font: inherit;
      }

      .prototype-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(216px, 260px) minmax(var(--phone-w), 1fr) minmax(260px, 330px);
        gap: 28px;
        padding: 28px;
        align-items: start;
      }

      .sidebar,
      .inspector {
        position: sticky;
        top: 24px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(210, 218, 212, 0.9);
        border-radius: 12px;
        box-shadow: 0 18px 44px rgba(28, 39, 33, 0.08);
        backdrop-filter: blur(18px);
      }

      .sidebar {
        padding: 18px;
      }

      .brand-row {
        display: flex;
        gap: 10px;
        align-items: center;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: var(--green-soft);
        color: var(--green);
        border: 1px solid #b8d4c8;
      }

      .brand-name {
        font-size: 15px;
        font-weight: 760;
        line-height: 1.1;
      }

      .brand-sub {
        margin-top: 3px;
        font-size: 12px;
        color: var(--muted);
      }

      .flow-nav {
        display: grid;
        gap: 8px;
        margin-top: 18px;
      }

      .flow-button {
        width: 100%;
        display: grid;
        grid-template-columns: 26px 1fr;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        text-align: left;
        cursor: pointer;
      }

      .flow-button:hover {
        background: rgba(47, 117, 102, 0.06);
      }

      .flow-button.is-active {
        color: var(--ink);
        background: var(--paper);
        border-color: var(--line);
        box-shadow: 0 8px 18px rgba(42, 62, 54, 0.08);
      }

      .flow-index {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #eef3ef;
        color: var(--green);
        font-size: 12px;
        font-weight: 760;
      }

      .flow-button.is-active .flow-index {
        background: var(--green);
        color: #fff;
      }

      .flow-title {
        font-size: 13px;
        font-weight: 720;
      }

      .flow-desc {
        margin-top: 2px;
        color: var(--quiet);
        font-size: 11px;
        line-height: 1.25;
      }

      .reference-link {
        display: block;
        margin-top: 18px;
        padding: 11px 12px;
        border-radius: 8px;
        background: #f7f4ed;
        color: #5d4a1f;
        border: 1px solid #eadbb7;
        text-decoration: none;
        font-size: 12px;
        line-height: 1.35;
      }

      .stage {
        display: grid;
        place-items: start center;
        min-width: 0;
      }

      .stage-title {
        width: min(860px, 100%);
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin: 4px 0 20px;
      }

      .stage-title h1 {
        margin: 0;
        font-size: clamp(24px, 3vw, 38px);
        line-height: 1.05;
        font-weight: 780;
      }

      .stage-title p {
        margin: 8px 0 0;
        max-width: 560px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .status-pill {
        flex: 0 0 auto;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 8px 11px;
        border: 1px solid #bdd8cd;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 12px;
        font-weight: 700;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }

      .phone-wrap {
        position: relative;
        width: var(--phone-w);
        min-height: 812px;
      }

      .phone {
        width: var(--phone-w);
        height: 812px;
        padding: 11px;
        border-radius: 48px;
        background: #111;
        box-shadow: var(--shadow);
      }

      .phone-screen {
        position: relative;
        height: 100%;
        overflow: hidden;
        border-radius: 38px;
        background: var(--paper);
        color: var(--ink);
      }

      .phone-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 5;
        height: 48px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 22px;
        font-size: 12px;
        font-weight: 740;
        background: linear-gradient(#fff 55%, rgba(255, 255, 255, 0));
      }

      .dynamic-island {
        position: absolute;
        left: 50%;
        top: 9px;
        transform: translateX(-50%);
        width: 108px;
        height: 30px;
        border-radius: 999px;
        background: #0a0d0c;
      }

      .status-icons {
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .signal {
        width: 14px;
        height: 10px;
        display: grid;
        grid-template-columns: repeat(4, 2px);
        align-items: end;
        gap: 1px;
      }

      .signal span {
        display: block;
        background: #111;
        border-radius: 1px;
      }

      .signal span:nth-child(1) { height: 3px; }
      .signal span:nth-child(2) { height: 5px; }
      .signal span:nth-child(3) { height: 7px; }
      .signal span:nth-child(4) { height: 9px; }

      .battery {
        width: 18px;
        height: 10px;
        border: 1.7px solid #111;
        border-radius: 3px;
        position: relative;
      }

      .battery::after {
        content: "";
        position: absolute;
        right: -4px;
        top: 2px;
        width: 2px;
        height: 4px;
        background: #111;
        border-radius: 0 2px 2px 0;
      }

      .battery::before {
        content: "";
        position: absolute;
        inset: 2px;
        width: 10px;
        background: #111;
        border-radius: 1px;
      }

      .app-screen {
        height: 100%;
        padding: 62px 18px 18px;
        overflow: auto;
        scrollbar-width: none;
      }

      .app-screen::-webkit-scrollbar {
        display: none;
      }

      .app-screen.with-tabs {
        padding-bottom: 92px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 34px;
        margin-bottom: 12px;
      }

      .icon-button,
      .text-button {
        display: inline-grid;
        place-items: center;
        min-width: 34px;
        height: 34px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--green);
        cursor: pointer;
      }

      .text-button {
        padding: 0 8px;
        font-size: 13px;
        font-weight: 700;
      }

      .screen-title {
        margin: 0;
        font-size: 20px;
        line-height: 1.16;
        font-weight: 780;
      }

      .screen-subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .center-hero {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 22px;
        padding-top: 40px;
      }

      .trust-emblem {
        width: 84px;
        height: 96px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        color: var(--green);
      }

      .welcome-copy {
        text-align: center;
      }

      .welcome-copy h2 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
        font-weight: 800;
      }

      .promise-list {
        display: grid;
        gap: 16px;
        margin-top: 34px;
      }

      .promise-item {
        display: grid;
        grid-template-columns: 30px 1fr;
        gap: 12px;
        align-items: start;
      }

      .promise-item svg {
        color: var(--green);
      }

      .promise-item strong {
        display: block;
        font-size: 14px;
        line-height: 1.2;
      }

      .promise-item span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .bottom-actions {
        display: grid;
        gap: 10px;
      }

      .trust-strip {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid #c9dbd3;
        border-radius: 999px;
        background: #f3faf6;
        color: var(--green);
        font-size: 11px;
        font-weight: 720;
      }

      .primary-button,
      .secondary-button,
      .danger-button {
        width: 100%;
        min-height: 50px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid transparent;
        font-size: 14px;
        font-weight: 760;
        cursor: pointer;
      }

      .primary-button {
        background: linear-gradient(180deg, #3d8979 0%, var(--green-strong) 100%);
        color: #fff;
        box-shadow: 0 10px 22px rgba(47, 117, 102, 0.22);
      }

      .secondary-button {
        background: #fff;
        color: var(--ink);
        border-color: var(--line);
      }

      .danger-button {
        background: var(--rose);
        color: #fff;
      }

      .link-button {
        border: 0;
        background: transparent;
        color: var(--green);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .permission-card,
      .scan-list,
      .task-card,
      .explain-card,
      .safety-card,
      .settings-row,
      .review-summary {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .permission-icon {
        width: 68px;
        height: 68px;
        margin: 26px auto 18px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--green);
        background: var(--green-soft);
      }

      .permission-copy {
        text-align: center;
        margin-bottom: 28px;
      }

      .permission-copy h2 {
        margin: 0;
        font-size: 22px;
        line-height: 1.18;
      }

      .permission-copy p {
        margin: 10px auto 0;
        width: 270px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .permission-points {
        display: grid;
        gap: 15px;
        margin: 0 8px 22px;
      }

      .permission-card {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 10px;
        padding: 12px;
        margin-top: 28px;
        background: #fbfcfb;
      }

      .permission-card p {
        margin: 0;
        font-size: 12px;
        line-height: 1.4;
        color: var(--muted);
      }

      .scan-center {
        display: grid;
        justify-items: center;
        padding-top: 42px;
      }

      .progress-ring {
        --p: 64;
        position: relative;
        width: 152px;
        height: 152px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: conic-gradient(var(--green) calc(var(--p) * 1%), #e5ebe7 0);
      }

      .progress-ring::before {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        background: #fff;
      }

      .progress-value {
        position: relative;
        text-align: center;
      }

      .progress-value strong {
        display: block;
        font-size: 36px;
        line-height: 1;
      }

      .progress-value span {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
      }

      .scan-caption {
        margin: 18px 0 14px;
        text-align: center;
      }

      .scan-caption strong {
        display: block;
        font-size: 16px;
      }

      .scan-caption span {
        display: inline-flex;
        margin-top: 9px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 12px;
        font-weight: 730;
      }

      .scan-list {
        margin-top: 18px;
        overflow: hidden;
      }

      .scan-row {
        display: grid;
        grid-template-columns: 1fr auto 18px;
        gap: 10px;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }

      .scan-row:last-child {
        border-bottom: 0;
      }

      .scan-row span {
        color: var(--muted);
      }

      .check-dot,
      .pending-dot {
        width: 17px;
        height: 17px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
      }

      .check-dot {
        background: var(--green-soft);
        color: var(--green);
      }

      .pending-dot {
        border: 1px solid var(--line-strong);
      }

      .results-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .mini-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 7px;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 10px;
        font-weight: 760;
      }

      .task-list {
        display: grid;
        gap: 10px;
      }

      .task-card {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        gap: 11px;
        padding: 12px;
        cursor: pointer;
      }

      .task-icon {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #f3f6f4;
        color: var(--green);
      }

      .task-card h3 {
        margin: 0;
        font-size: 14px;
        line-height: 1.15;
      }

      .task-card p {
        margin: 4px 0 7px;
        color: var(--muted);
        font-size: 11px;
      }

      .task-count {
        font-size: 18px;
        font-weight: 800;
        align-self: start;
      }

      .thumb-strip {
        display: flex;
        gap: 4px;
      }

      .thumb {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 6px;
        background-image: url("../../design/mvp-trust-validation/assets/photo-thumbnails.png");
        background-size: 400% 400%;
        background-position: var(--pos);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.7);
      }

      .thumb.is-screen {
        background-image:
          linear-gradient(180deg, rgba(255,255,255,0.88), rgba(255,255,255,0.74)),
          url("../../design/mvp-trust-validation/assets/photo-thumbnails.png");
      }

      .review-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
        margin-top: 12px;
      }

      .review-photo {
        position: relative;
        aspect-ratio: 1;
        border-radius: 8px;
        overflow: hidden;
        background-image: url("../../design/mvp-trust-validation/assets/photo-thumbnails.png");
        background-size: 400% 400%;
        background-position: var(--pos);
        border: 2px solid transparent;
        cursor: pointer;
      }

      .review-photo.hero {
        grid-column: 1 / -1;
        aspect-ratio: 1.85;
        border-color: var(--green);
      }

      .select-ring {
        position: absolute;
        right: 7px;
        top: 7px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 2px solid rgba(255,255,255,0.92);
        background: rgba(255,255,255,0.3);
        color: #fff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      }

      .review-photo.is-selected .select-ring {
        background: var(--green);
      }

      .keep-label {
        position: absolute;
        left: 8px;
        top: 8px;
        display: inline-flex;
        gap: 5px;
        align-items: center;
        padding: 4px 7px;
        border-radius: 999px;
        background: rgba(230, 241, 236, 0.95);
        color: var(--green);
        font-size: 10px;
        font-weight: 760;
      }

      .group-meta {
        display: flex;
        justify-content: space-between;
        margin: 10px 0 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .explain-card,
      .safety-card {
        padding: 13px;
        background: var(--yellow-soft);
        border-color: #f1ddb2;
      }

      .explain-card h3,
      .safety-card h3 {
        margin: 0 0 6px;
        font-size: 13px;
      }

      .explain-card p,
      .safety-card p {
        margin: 0;
        color: #6d5a2b;
        font-size: 12px;
        line-height: 1.45;
      }

      .review-summary {
        padding: 10px 12px;
        margin-bottom: 10px;
        background: var(--yellow-soft);
        border-color: #f1ddb2;
      }

      .review-summary strong {
        display: block;
        font-size: 13px;
        color: #8a6518;
      }

      .review-summary span {
        display: block;
        margin-top: 3px;
        color: #6d5a2b;
        font-size: 11px;
        line-height: 1.35;
      }

      .bin-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 12px 0;
      }

      .bin-tile {
        position: relative;
        aspect-ratio: 1;
        border-radius: 8px;
        background-image: url("../../design/mvp-trust-validation/assets/photo-thumbnails.png");
        background-size: 400% 400%;
        background-position: var(--pos);
        overflow: hidden;
        border: 2px solid transparent;
        cursor: pointer;
      }

      .bin-tile.is-selected {
        border-color: var(--green);
      }

      .video-chip {
        position: absolute;
        right: 5px;
        bottom: 5px;
        padding: 3px 5px;
        border-radius: 5px;
        background: rgba(12, 15, 14, 0.72);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
      }

      .checklist {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .checklist li {
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 8px;
        align-items: start;
        color: #38514a;
        font-size: 12px;
        line-height: 1.35;
      }

      .bin-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      .promise-section {
        display: grid;
        gap: 14px;
      }

      .promise-block {
        display: grid;
        grid-template-columns: 32px 1fr;
        gap: 12px;
      }

      .promise-block h3 {
        margin: 0;
        font-size: 14px;
      }

      .promise-block p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .icloud-card {
        margin-top: 18px;
        padding: 13px;
        border: 1px solid #f1ddb2;
        border-radius: 8px;
        background: var(--yellow-soft);
      }

      .icloud-card h3 {
        margin: 0 0 8px;
        font-size: 14px;
      }

      .settings-list {
        display: grid;
        gap: 8px;
        margin-top: 18px;
      }

      .settings-row {
        min-height: 42px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 12px;
        font-size: 13px;
        font-weight: 650;
      }

      .tabbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        height: 72px;
        padding: 8px 18px 14px;
        background: rgba(255, 255, 255, 0.94);
        border-top: 1px solid var(--line);
        backdrop-filter: blur(18px);
      }

      .tab-button {
        display: grid;
        justify-items: center;
        gap: 4px;
        border: 0;
        background: transparent;
        color: var(--quiet);
        font-size: 10px;
        cursor: pointer;
      }

      .tab-button.is-active {
        color: var(--green);
        font-weight: 760;
      }

      .modal-scrim {
        position: absolute;
        inset: 0;
        z-index: 8;
        display: none;
        align-items: end;
        background: rgba(16, 22, 19, 0.28);
      }

      .modal-scrim.is-open {
        display: flex;
      }

      .sheet {
        width: 100%;
        padding: 18px;
        border-radius: 18px 18px 0 0;
        background: #fff;
        box-shadow: 0 -18px 44px rgba(12, 16, 14, 0.16);
      }

      .sheet h2 {
        margin: 0;
        font-size: 20px;
        line-height: 1.15;
      }

      .sheet p {
        margin: 8px 0 16px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .sheet-warning {
        padding: 12px;
        border-radius: 8px;
        background: var(--yellow-soft);
        border: 1px solid #f1ddb2;
        color: #6d5a2b;
        font-size: 12px;
        line-height: 1.4;
        margin-bottom: 12px;
      }

      .inspector {
        padding: 18px;
      }

      .inspector h2 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
      }

      .inspector p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .spec-section {
        margin-top: 18px;
      }

      .spec-section h3 {
        margin: 0 0 8px;
        font-size: 12px;
        text-transform: uppercase;
        color: var(--green);
        letter-spacing: 0.08em;
      }

      .spec-list {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .spec-list li {
        padding: 9px 10px;
        border-radius: 8px;
        background: #f8faf8;
        border: 1px solid var(--line);
        color: #39433f;
        font-size: 12px;
        line-height: 1.4;
      }

      .token-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .swatch {
        height: 34px;
        border-radius: 7px;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }

      .proto-svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .svg-large {
        width: 84px;
        height: 96px;
        stroke-width: 1.5;
      }

      @media (max-width: 1120px) {
        .prototype-shell {
          grid-template-columns: 1fr;
        }

        .sidebar,
        .inspector {
          position: static;
        }

        .flow-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .stage-title {
          display: block;
        }

        .status-pill {
          margin-top: 14px;
        }
      }

      @media (max-width: 520px) {
        .prototype-shell {
          padding: 12px;
        }

        .flow-nav {
          grid-template-columns: 1fr;
        }

        .phone-wrap,
        .phone {
          width: min(var(--phone-w), calc(100vw - 24px));
        }

        .phone {
          height: 780px;
        }
      }
    </style>
  </head>
  <body>
    <main class="prototype-shell">
      <aside class="sidebar" aria-label="Prototype flow">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">
            <svg class="proto-svg" viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M12 15v2"/></svg>
          </div>
          <div>
            <div class="brand-name">TrueKeep / 留真</div>

          </div>
        </div>
        <nav class="flow-nav" id="flowNav"></nav>
        <a class="reference-link" href="../../design/mvp-trust-validation/assets/visual-concept.png">
          查看视觉概念图：7 个 iPhone 状态并排，用于开发前对齐整体风格。
        </a>
      </aside>

      <section class="stage" aria-label="Interactive iPhone prototype">
        <div class="stage-title">
          <div>
            <h1>本地 AI 相册清理，留下真正值得留的回忆。</h1>
            <p>这套高保真原型覆盖 MVP 的信任建立、权限说明、本地扫描、结果呈现、逐组复核、复核箱 和删除安全确认。</p>
          </div>
          <div class="status-pill"><span class="dot"></span> 可点击交互稿</div>
        </div>

        <div class="phone-wrap">
          <div class="phone" role="presentation">
            <div class="phone-screen">
              <div class="phone-top" aria-hidden="true">
                <span>9:41</span>
                <div class="dynamic-island"></div>
                <span class="status-icons">
                  <span class="signal"><span></span><span></span><span></span><span></span></span>
                  <span>5G</span>
                  <span class="battery"></span>
                </span>
              </div>
              <div id="app" class="app-screen"></div>
              <div id="modalRoot" class="modal-scrim"></div>

      <aside class="inspector" aria-label="Interaction notes">
        <h2 id="inspectorTitle"></h2>
        <p id="inspectorSummary"></p>
        <div class="spec-section">

        </div>
        <div class="spec-section">
          <h3>开发要点</h3>
          <ul class="spec-list" id="devList"></ul>
        </div>
        <div class="spec-section">
          <h3>颜色 Token</h3>
          <div class="token-grid" aria-hidden="true">
            <span class="swatch" style="background:#ffffff"></span>
            <span class="swatch" style="background:#2f7566"></span>
            <span class="swatch" style="background:#fff6df"></span>
            <span class="swatch" style="background:#c96372"></span>
          </div>
        </div>
      </aside>
    </main>

    <script>
      const icon = {
        shield: '<svg class="proto-svg" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-2.8 8-7 10-4.2-2-7-5.4-7-10V6l7-3z"/><path d="M9 12l2 2 4-5"/></svg>',
        lock: '<svg class="proto-svg" viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M12 15v2"/></svg>',
        cloud: '<svg class="proto-svg" viewBox="0 0 24 24"><path d="M17.5 19H8a5 5 0 1 1 1-9.9A6.5 6.5 0 0 1 21 12.5 3.5 3.5 0 0 1 17.5 19z"/></svg>',
        eye: '<svg class="proto-svg" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="3"/></svg>',

          dev: ["首屏文案必须和隐私承诺一致。", "CTA 前不得触发系统权限弹窗。", "信任条用于承接无上传、无联网的核心承诺。"]

          interactions: ["点击任一任务卡进入逐组复核。", "点击底部 复核箱 进入复核篮。", "点击设置进入隐私与安全页。"],

      }

        return screens.find((item) => item.id === id);
      }

      function setScreen(id) {
        lastScreen = currentScreen;
        currentScreen = id;
        render();
      }

      function renderNav() {
        flowNav.innerHTML = screens.map((screen, index) => `

            <span>

              <span class="flow-desc">${screen.desc}</span>
            </span>
          </button>

        flowNav.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => setScreen(button.dataset.screen));
        });
      }

      function renderInspector() {
        const screen = screenById(currentScreen);
        document.getElementById("inspectorTitle").textContent = screen.title;

      function renderPermission() {

        app.innerHTML = `
          ${topbar("", { back: "welcome" })}

              <h2>我们只需要访问<br>你的照片和视频</h2>

        app.innerHTML = `

            <div class="scan-row"><strong>分析大视频</strong><span>待处理</span><span class="pending-dot"></span></div>
          </div>
          <div class="bottom-actions" style="position:absolute;left:18px;right:18px;bottom:18px;">
            <button class="primary-button" type="button" data-screen="results">查看结果</button>
            <button class="secondary-button" type="button" data-screen="permission">取消</button>
            <p class="screen-subtitle" style="text-align:center;margin:0;">你可以关闭 App，我们会在后台继续。</p>
          </div>
        `;
      }

      function taskCard(kind, title, desc, count, thumbs, risk = "建议复核") {
        return `
          <article class="task-card" data-screen="review">
            <div class="task-icon">${icon[kind]}</div>
            <div>
              <h3>${title}</h3>
              <p>${desc}</p>
              <div class="thumb-strip">${thumbs.map((id) => thumb(id, kind === "photo" ? "is-screen" : "")).join("")}</div>
            </div>
            <div>
              <div class="task-count">${count}</div>
              <div class="mini-pill" style="margin-top:6px;">${risk}</div>
            </div>
          </article>
        `;
      }

      function renderResults() {
        app.className = "app-screen with-tabs";
        app.innerHTML = `
          <div class="results-head">
            <div>
              <h2 class="screen-title">扫描结果</h2>
              <p class="screen-subtitle">我们找到了值得你复核的项目。</p>
            </div>
            <span class="mini-pill"><span class="dot"></span>本地</span>
          </div>
          <div class="task-list">
            ${taskCard("stack", "相似连拍", "67 组，建议保留最佳照片", "1,284", [0,1,2,3], "推荐复核")}
            ${taskCard("photo", "截图和聊天截图", "旧截图、重复截图和临时信息", "568", [8,9,10], "可快速清理")}
            ${taskCard("camera", "可能是误拍", "口袋、地板、天花板等低价值照片", "342", [12,13,14], "谨慎复核")}
            ${taskCard("blur", "模糊或遮挡", "低清晰度或手指遮挡", "213", [5,6,7], "低置信度")}
            ${taskCard("video", "占空间的大视频", "大于 500 MB 的视频", "24", [11,15,4], "建议复核")}
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 2px 0;">
            <span class="screen-subtitle">预计可释放空间</span>
            <strong>8.7 GB</strong>
          </div>
          <button class="primary-button" type="button" data-screen="review" style="margin-top:12px;">复核项目</button>
          ${bottomTabs("home")}
        `;
      }

      function renderReview() {
        const selectedCount = selectedReview.size;
        app.className = "app-screen";
        app.innerHTML = `
          ${topbar("相似照片", { back: "results" })}
          <p class="screen-subtitle" style="text-align:center;margin-top:-12px;">第 12 组 / 67 组</p>
          <div class="review-grid">
            <div class="review-photo hero" style="--pos:${photoPos[0]}">
              <span class="keep-label">推荐保留</span>
              <span class="select-ring">✓</span>
            </div>
            ${[1,2,3,4,5,6].map((id) => `
              <button class="review-photo ${selectedReview.has(id) ? "is-selected" : ""}" type="button" data-review-id="${id}" style="--pos:${photoPos[id]}">
                <span class="select-ring">${selectedReview.has(id) ? "✓" : ""}</span>
              </button>
            `).join("")}
          </div>
          <div class="group-meta">
            <span>7 张照片</span>
            <span>预计释放 12.4 MB</span>
          </div>
          <div class="explain-card">
            <h3>为什么标记这组？</h3>
            <p>这些照片看起来非常相似。保留一张清晰表情更好的照片，可以减少重复。</p>
          </div>
          <div class="bottom-actions" style="margin-top:13px;">
            <button class="primary-button" type="button" data-screen="bin">加入 复核箱（${selectedCount}）</button>
            <button class="secondary-button" type="button">复核本组全部</button>
            <div style="display:flex;justify-content:space-between;">
              <button class="link-button" type="button">上一组</button>
              <button class="link-button" type="button">下一组</button>
            </div>
          </div>
        `;
      }

      function renderBin() {
        const selectedCount = selectedBin.size;
        app.className = "app-screen with-tabs";
        if (binDeleted) {
          app.innerHTML = `
            <div class="topbar">
              <span></span>
              <strong>复核箱</strong>
              <span></span>
            </div>
            <section class="scan-center" style="padding-top:86px;">
              <div class="permission-icon" style="margin-bottom:18px;">${icon.shield}</div>
              <h2 class="screen-title" style="text-align:center;">复核箱 已清空</h2>
              <p class="screen-subtitle" style="text-align:center;max-width:280px;">所选项目已移入 Photos 的 Recently Deleted。建议保留恢复窗口，不要立即清空。</p>
              <button class="primary-button" type="button" data-screen="results" style="margin-top:26px;">回到首页</button>
            </section>
            ${bottomTabs("bin")}
          `;
          return;
        }
        app.innerHTML = `
          <div class="topbar">
            <span></span>
            <strong>复核箱</strong>
            <button class="text-button" type="button" id="selectAll">${selectedCount === 6 ? "取消" : "全选"}</button>
          </div>
          <p class="screen-subtitle" style="text-align:center;margin-top:-8px;">${selectedCount} 项 · 156.3 MB</p>
          <div class="review-summary">
            <strong>尚未删除任何内容</strong>
            <span>复核箱 中的项目只会在你确认后移除。</span>
          </div>
          <div class="bin-grid">
            ${[1,2,8,3,4,10].map((id, index) => `
              <button class="bin-tile ${selectedBin.has(index) ? "is-selected" : ""}" type="button" data-bin-id="${index}" style="--pos:${photoPos[id]}">
                <span class="select-ring">${selectedBin.has(index) ? "✓" : ""}</span>
                ${index === 2 || index === 5 ? '<span class="video-chip">2.1MB</span>' : ""}
              </button>
            `).join("")}
          </div>
          <div class="safety-card">
            <h3>删除安全清单</h3>
            <ul class="checklist">
              <li><span>✓</span><span>项目仍在 复核箱，还没有删除</span></li>
              <li><span>✓</span><span>你可以逐张复核每一项</span></li>
              <li><span>✓</span><span>删除后仍可从 Recently Deleted 恢复</span></li>
              <li><span>✓</span><span>未经确认不会影响 iCloud</span></li>
            </ul>
          </div>
          <div class="bin-actions">
            <button class="secondary-button" type="button">恢复选中</button>
            <button class="danger-button" type="button" id="deleteSelected">删除选中（${selectedCount}）</button>
          </div>
          <p class="screen-subtitle" style="text-align:center;">复核箱 项目仅本地保存 30 天。</p>
          ${bottomTabs("bin")}
        `;
      }

      function renderPrivacy() {
        app.className = "app-screen";
        const back = lastScreen && lastScreen !== "privacy" ? lastScreen : "results";
        app.innerHTML = `
          ${topbar("隐私与安全", { back })}
          <section class="promise-section">
            <div>
              <h2 class="screen-title">我们的承诺</h2>
              <p class="screen-subtitle">用清楚的话说明留真会做什么，也说明不会做什么。</p>
            </div>
            <div class="promise-block">${icon.lock}<div><h3>100% 本地处理</h3><p>所有分析都在你的 iPhone 上完成，不经过服务器。</p></div></div>
            <div class="promise-block">${icon.cloud}<div><h3>不收集照片或视频</h3><p>我们不会收集、上传、分享你的照片或视频。</p></div></div>
            <div class="promise-block">${icon.eye}<div><h3>不做跟踪</h3><p>没有广告 SDK，没有用于画像的追踪。</p></div></div>
            <div class="promise-block">${icon.user}<div><h3>由你控制</h3><p>你决定保留什么、删除什么。未经你确认不会删除。</p></div></div>
          </section>
          <section class="icloud-card">
            <h3>iCloud Photos</h3>
            <p class="screen-subtitle">删除照片或视频可能会同步到 iCloud 和其他设备。真正删除前，请在 Photos App 的 Recently Deleted 中保留恢复窗口。</p>
          </section>
          <section class="settings-list">
            <button class="settings-row" type="button"><span>留真如何工作</span>${icon.chevron}</button>
            <button class="settings-row" type="button"><span>数据与隐私细节</span>${icon.chevron}</button>
            <button class="settings-row" type="button"><span>帮助与支持</span>${icon.chevron}</button>
          </section>
          <p class="screen-subtitle" style="text-align:center;margin-top:22px;">TrueKeep / 留真 · v1.0.0</p>
        `;
      }

      function openDeleteSheet() {
        modalRoot.innerHTML = `
          <div class="sheet" role="dialog" aria-modal="true" aria-label="Confirm delete">
            <h2>删除前再确认一次</h2>
            <p>这 ${selectedBin.size} 项照片或视频会从系统照片图库移除。删除后通常可以在 Recently Deleted 中恢复。</p>
            <div class="sheet-warning">
              如果你开启了 iCloud Photos，删除可能会同步到 iCloud 和其他设备。请不要立即清空 Recently Deleted。
            </div>
            <div class="bottom-actions">
              <button class="danger-button" type="button" id="confirmDelete">确认删除 ${selectedBin.size} 项</button>
              <button class="secondary-button" type="button" id="closeSheet">返回复核</button>
            </div>
          </div>
        `;
        modalRoot.classList.add("is-open");
        bindModalEvents();
      }

      function closeSheet() {
        modalRoot.classList.remove("is-open");
      }

      function bindAppEvents() {
        app.querySelectorAll("[data-screen]").forEach((node) => {
          node.addEventListener("click", () => {
            if (currentScreen === "review" && node.dataset.screen === "bin") {
              binDeleted = false;
              selectedBin = new Set([0, 1, 2, 3, 4, 5]);
            }
            setScreen(node.dataset.screen);
          });
        });

        app.querySelectorAll("[data-review-id]").forEach((node) => {
          node.addEventListener("click", () => {
            const id = Number(node.dataset.reviewId);
            if (selectedReview.has(id)) selectedReview.delete(id);
            else selectedReview.add(id);
            render();
          });
        });

        app.querySelectorAll("[data-bin-id]").forEach((node) => {
          node.addEventListener("click", () => {
            const id = Number(node.dataset.binId);
            if (selectedBin.has(id)) selectedBin.delete(id);
            else selectedBin.add(id);
            render();
          });
        });

        const deleteButton = document.getElementById("deleteSelected");
        if (deleteButton) {
          deleteButton.addEventListener("click", openDeleteSheet);
        }

        const selectAll = document.getElementById("selectAll");
        if (selectAll) {
          selectAll.addEventListener("click", () => {
            if (selectedBin.size === 6) selectedBin.clear();
            else selectedBin = new Set([0, 1, 2, 3, 4, 5]);
            render();
          });
        }
      }

      function bindModalEvents() {
        const close = document.getElementById("closeSheet");
        if (close) close.addEventListener("click", closeSheet);
        const confirm = document.getElementById("confirmDelete");
        if (confirm) {
          confirm.addEventListener("click", () => {
            selectedBin.clear();
            binDeleted = true;
            closeSheet();
            render();
          });
        }
      }

      function render() {
        modalRoot.classList.remove("is-open");
        if (currentScreen === "welcome") renderWelcome();
        if (currentScreen === "permission") renderPermission();
        if (currentScreen === "scan") renderScan();
        if (currentScreen === "results") renderResults();
        if (currentScreen === "review") renderReview();
        if (currentScreen === "bin") renderBin();
        if (currentScreen === "privacy") renderPrivacy();
        renderNav();
        renderInspector();
        bindAppEvents();
      }

      modalRoot.addEventListener("click", (event) => {
        if (event.target === modalRoot) closeSheet();
      });

      render();
    </script>
  </body>
</html>
