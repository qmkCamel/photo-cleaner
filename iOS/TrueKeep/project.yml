name: TrueKeep
options:
  bundleIdPrefix: app.truekeep
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
packages: {}
targets:
  TrueKeep:
    type: application
    platform: iOS
    sources:
      - path: TrueKeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.truekeep.ios
        INFOPLIST_FILE: TrueKeep/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets:
        - TrueKeepTests
        - TrueKeepUITests
  TrueKeepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrueKeepTests
    dependencies:
      - target: TrueKeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.truekeep.ios.tests
        INFOPLIST_FILE: TrueKeepTests/Info.plist
  TrueKeepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TrueKeepUITests
    dependencies:
      - target: TrueKeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.truekeep.ios.uitests
        INFOPLIST_FILE: TrueKeepUITests/Info.plist
