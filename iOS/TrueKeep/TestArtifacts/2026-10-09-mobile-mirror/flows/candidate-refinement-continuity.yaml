name: P0 候选复核离页继续与取消恢复
platform: ios
appId: app.truekeep.ios
---
- launchApp
- waitUntil:
    target:
      accessibilityId:
        value: truekeep.scan.stage
        match: contains
    timeout: 10
- assertVisible:
    text:
      value: 正在复核候选
      match: contains
- assertVisible:
    text:
      value: 候选复核
      match: contains
- assertVisible:
    accessibilityId:
      value: truekeep.scan.cancel
      match: contains
- tap:
    accessibilityId:
      value: truekeep.scan.continue-browsing
      match: contains
- waitUntil:
    target:
      accessibilityId:
        value: truekeep.cleanup.active-scan
        match: contains
    timeout: 10
- assertVisible:
    text:
      value: 候选复核
      match: contains
- tap:
    accessibilityId:
      value: truekeep.cleanup.active-scan
      match: contains
- waitUntil:
    target:
      accessibilityId:
        value: truekeep.scan.cancel
        match: contains
    timeout: 10
- tap:
    accessibilityId:
      value: truekeep.scan.cancel
      match: contains
- waitUntil:
    target:
      accessibilityId:
        value: truekeep.scan.retry
        match: contains
    timeout: 10
- assertVisible:
    text:
      value: 扫描已停止
      match: contains
- assertVisible:
    text:
      value: 取消扫描不会删除或移动任何照片或视频。
      match: contains
- done
