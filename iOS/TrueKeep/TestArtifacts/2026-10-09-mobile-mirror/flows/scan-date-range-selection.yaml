name: P0 扫描时间范围选择
platform: ios
appId: app.truekeep.ios
---
- launchApp
- waitUntil:
    target:
      accessibilityId:
        value: truekeep.cleanup.date-range.selector
        match: contains
    timeout: 10
- assertVisible:
    text:
      value: 已选择：近一个月
      match: contains
- tap:
    accessibilityId:
      value: truekeep.cleanup.date-range.lastThreeMonths
      match: contains
- waitUntil:
    target:
      text:
        value: 已选择：近三个月
        match: contains
    timeout: 5
- tap:
    accessibilityId:
      value: truekeep.cleanup.scan
      match: contains
- waitUntil:
    target:
      accessibilityId:
        value: truekeep.scan.view-results
        match: contains
    timeout: 20
- assertVisible:
    accessibilityId:
      value: truekeep.scan.date-range.active
      match: contains
- assertVisible:
    text:
      value: 本次范围：近三个月
      match: contains
- tap:
    accessibilityId:
      value: truekeep.scan.view-results
      match: contains
- waitUntil:
    target:
      accessibilityId:
        value: truekeep.cleanup.results
        match: contains
    timeout: 10
- assertVisible:
    accessibilityId:
      value: truekeep.cleanup.date-range.completed
      match: contains
- assertVisible:
    text:
      value: 本次范围：近三个月
      match: contains
- assertVisible:
    text:
      value: 已选择：近三个月
      match: contains
- done
