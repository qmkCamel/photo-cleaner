name: P0 权限拒绝后的重试与恢复
platform: ios
appId: app.truekeep.ios
---
- launchApp
- waitUntil:
    target:
      accessibilityId:
        value: truekeep.permission-issue.retry
        match: contains
    timeout: 10
- assertVisible:
    text:
      value: 照片权限已关闭
      match: contains
- assertVisible:
    text:
      value: 照片或视频不会被上传
      match: contains
- assertVisible:
    accessibilityId:
      value: truekeep.permission-issue.open-settings
      match: contains
- tap:
    accessibilityId:
      value: truekeep.permission-issue.retry
      match: contains
- waitUntil:
    target:
      text:
        value: 正在重新检查
        match: contains
    timeout: 3
- assertVisible:
    accessibilityId:
      value: truekeep.permission-issue.open-settings
      match: contains
- waitUntil:
    target:
      text:
        value: 我已开启，重新检查
        match: contains
    timeout: 8
- tap:
    accessibilityId:
      value: truekeep.permission-issue.return-to-permission
      match: contains
- waitUntil:
    target:
      accessibilityId:
        value: truekeep.cleanup.results
        match: contains
    timeout: 10
- assertVisible:
    accessibilityId:
      value: truekeep.cleanup.task.similar
      match: contains
- done
