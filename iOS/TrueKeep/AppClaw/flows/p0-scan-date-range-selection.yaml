appId: app.truekeep.ios
name: P0 扫描时间范围选择
description: 验证默认近一个月，可切换到近三个月，并在扫描进度与完成结果中保留实际扫描范围。
platform: ios
---
setup:
  - launchApp
  - waitUntil: truekeep.cleanup.date-range.selector
    timeout: 10
  - assert: 已选择：近一个月
steps:
  - tap: truekeep.cleanup.date-range.lastThreeMonths
  - waitUntil: 已选择：近三个月
    timeout: 5
  - tap: truekeep.cleanup.scan
  - waitUntil: truekeep.scan.view-results
    timeout: 20
  - assert: truekeep.scan.date-range.active
  - assert: 本次范围：近三个月
  - tap: truekeep.scan.view-results
assertions:
  - waitUntil: truekeep.cleanup.results
    timeout: 10
  - assert: truekeep.cleanup.date-range.completed
  - assert: 本次范围：近三个月
  - assert: 已选择：近三个月
  - done
