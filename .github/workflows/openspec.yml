name: OpenSpec

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install repository-tested OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.2.0

      - name: Validate OpenSpec lifecycle
        env:
          OPENSPEC_TELEMETRY: "0"
        run: python3 openspec/check.py
